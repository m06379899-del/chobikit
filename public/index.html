<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChobiKit</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("chobikit-locale");
        } catch (e) {}
        var lang = stored;
        if (lang !== "bn" && lang !== "en") {
          var langs = navigator.languages || [navigator.language];
          var bn = langs.some(function (l) {
            return l && l.slice(0, 2).toLowerCase() === "bn";
          });
          lang = bn ? "bn" : "en";
        }
        location.replace("/" + lang + "/");
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/en/" />
    </noscript>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 2rem">
      <a href="/en/">ChobiKit</a>
    </p>
  </body>
</html>
